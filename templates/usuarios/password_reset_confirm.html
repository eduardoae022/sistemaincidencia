{% extends 'base.html' %}
{% block auth_content %}
<div class="login-page">
  <div class="login-card">
    <h2 class="text-center mb-4" style="font-size:1.3rem;font-weight:800;color:var(--primary)">Nueva contraseña</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary-custom w-100" id="btn_nueva_pass">Establecer nueva contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
