{% extends 'base.html' %}
{% block auth_content %}
<div class="login-page">
  <div class="login-card text-center">
    <i class="bi bi-envelope-check display-4 text-success mb-3"></i>
    <h2 class="mb-2">Email enviado</h2>
    <p class="text-muted mb-4">Si el email está registrado, recibirá las instrucciones para restablecer su contraseña.</p>
    <a href="{% url 'usuarios:login' %}" class="btn btn-primary-custom">Volver al login</a>
  </div>
</div>
{% endblock %}
