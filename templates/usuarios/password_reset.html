{% extends 'base.html' %}
{% block auth_content %}
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 6 3.676 6 7c0 2.21 1.128 4.166 2.837 5.326L8 20h8l-.837-7.674C16.872 11.166 18 9.21 18 7c0-3.324-2.676-6-6-6zm0 2c2.22 0 4 1.78 4 4s-1.78 4-4 4-4-1.78-4-4 1.78-4 4-4z"/></svg>
    </div>
    <h1 class="text-center mb-1" style="font-size:1.3rem;font-weight:800;color:var(--primary)">Recuperar contraseña</h1>
    <p class="text-center text-muted mb-4" style="font-size:.82rem">Ingrese su email para recibir las instrucciones</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email registrado</label>
        <input type="email" name="email" class="form-control form-control-lg" placeholder="correo@empresa.com" required id="id_email_reset">
      </div>
      <button type="submit" class="btn btn-primary-custom w-100 py-2" id="btn_reset">Enviar instrucciones</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'usuarios:login' %}" class="text-muted" style="font-size:.8rem">Volver al login</a>
    </div>
  </div>
</div>
{% endblock %}
